spring:
  application:
    name: telegram-bot
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5431/telegrambot-db
    username: userbot
    password: passbot
  # JPA properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: true

verifyBot:
  botName: your_bot_name_from_bot_father
  botToken: your_bot_token_from_bot_father



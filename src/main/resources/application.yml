spring:
  application:
    name: telegram-bot
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5431/telegrambot-db
    username: userbot
    password: passbot
  # JPA properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: true

contador:
  mensajes-test: 0
  aciertos: 0

verifyBot:
  botName: your_bot_name_from_bot_father
  botToken: your_bot_token_from_bot_father

openai:
  key: your_openai_key

server-url:
  image-processing:  http://localhost:5000/process_image
  audio-transcription: https://api.openai.com/v1/audio/transcriptions